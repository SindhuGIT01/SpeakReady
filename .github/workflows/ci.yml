name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff~=0.16
      - name: Run ruff check
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages (libGL for mediapipe/opencv)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee pytest_output.log
          status=$?
          {
            echo '## Pytest output (last 250 lines) [TEMP diagnostic]'
            echo '```'
            tail -n 250 pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
